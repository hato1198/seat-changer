<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://hato1198.github.io/seat-changer/assets/images/favicon.ico" type="image/x-icon"/>
  <link rel="shortcut icon" href="https://hato1198.github.io/seat-changer/assets/images/favicon.ico" type="image/x-icon"/>
  <title>ランダム席替えツール</title>
  <!-- Added font weights 700 for bold headings -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <meta name="generator" content="Jekyll v3.10.0" />
  <meta property="og:title" content="ランダム席替えツール" />
  <meta name="author" content="hato1198" />
  <meta property="og:locale" content="en_US" />
  <meta name="description" content="くじ引き風の席替えを簡単にできるツールです。" />
  <meta property="og:description" content="くじ引き風の席替えを簡単にできるツールです。" />
  <link rel="canonical" href="/" />
  <meta property="og:url" content="/" />
  <meta property="og:site_name" content="ランダム席替えツール" />
  <meta property="og:image" content="https://hato1198.github.io/seat-changer/assets/images/ogp.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta property="twitter:image" content="https://hato1198.github.io/seat-changer/assets/images/ogp.png" />
  <meta property="twitter:title" content="ランダム席替えツール" />
  <meta name="twitter:site" content="@hato_1198" />
  <meta name="twitter:creator" content="@hato1198" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <!-- 設定画面 -->
  <div id="config-screen">
    <div class="screen-header">
      <h1>ランダム席替えツール</h1>
      <p class="subtitle">座席と生徒情報を入力して、<br class="sp-break">くじ引き風に席を決めましょう</p>
    </div>
    
    <div class="config-container">
      <div class="config-card config-left">
        <div class="card-header">
          <h2>1. 生徒情報の入力</h2>
        </div>
        <div class="card-body">
          <div class="input-group">
            <label for="student-info" id="student-info-label">生徒名簿</label>
            <p id="explanation" class="helper-text">※名前を番号順に改行区切りで入力してください</p>
            <textarea id="student-info" placeholder="例：織田&#13;　　徳川&#13;　　豊臣"></textarea>
          </div>

          <div id="extra-options" class="options-group">
            <label class="checkbox-label">
              <input type="checkbox" id="auto-number" checked />
              <span class="checkmark"></span>
              番号を自動で割り当てる
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="show-furigana" />
              <span class="checkmark"></span>
              座席表に読み仮名を表示
            </label>
          </div>

          <div class="settings-row">
            <div class="input-group">
              <label for="assignment-order">席決定順</label>
              <div class="select-wrapper">
                <select id="assignment-order">
                  <option value="asc" selected>番号が小さい順</option>
                  <option value="desc">番号が大きい順</option>
                  <option value="random">ランダム</option>
                </select>
              </div>
            </div>

            <div class="input-group">
              <label for="auto-mode">実行モード</label>
              <div class="select-wrapper">
                <select id="auto-mode">
                  <option value="manual" selected>手動クリック</option>
                  <option value="auto">全自動</option>
                </select>
              </div>
            </div>
          </div>

          <div id="auto-interval-container" class="input-group" style="display: none;">
            <label for="auto-interval">決定間隔（秒）</label>
            <input type="number" id="auto-interval" min="0" step="0.1" value="2">
          </div>
        </div>
      </div>

      <div class="config-card config-right">
        <div class="card-header">
          <h2>2. 座席レイアウト</h2>
        </div>
        <div class="card-body">
          <div class="settings-row">
            <div class="input-group">
              <label for="row-count">縦の列数</label>
              <div class="select-wrapper">
                <select id="row-count">
                  <option value="2">2列</option>
                  <option value="3">3列</option>
                  <option value="4">4列</option>
                  <option value="5">5列</option>
                  <option value="6" selected>6列</option>
                  <option value="7">7列</option>
                  <option value="8">8列</option>
                </select>
              </div>
            </div>
            <div class="input-group">
              <label for="col-count">横の行数</label>
              <div class="select-wrapper">
                <select id="col-count">
                  <option value="2">2席</option>
                  <option value="3">3席</option>
                  <option value="4">4席</option>
                  <option value="5">5席</option>
                  <option value="6" selected>6席</option>
                  <option value="7">7席</option>
                  <option value="8">8席</option>
                </select>
              </div>
            </div>
          </div>

          <div class="preview-section">
            <h3>配置プレビュー</h3>
            <p class="helper-text">※クリックして使用しない席を設定</p>
            <div id="preview-grid"></div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="action-area">
      <button id="start-assignment-button" class="assign-button primary-btn">席替えを始める</button>
    </div>
  </div>

  <!-- 席替え画面 -->
  <div id="assignment-screen" style="display:none;">
    <div id="container">
      <div id="left-pane">
        <div class="status-card">
          <h2 id="instruction">準備完了</h2>
          <button id="assign-button" class="assign-button action-btn">席を決める</button>
        </div>
      </div>
      <div id="right-pane">
        <div class="stage-container">
          <div class="blackboard">黒板 / 教卓</div>
          <table id="seat-table"></table>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
